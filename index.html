<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify/themes/vue.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify-sidebar-collapse/dist/sidebar.min.css" />
  <style>
    :root{
      --navy:#18324b;
      --teal:#197c78;
      --ink:#263746;
      --muted:#6b7b88;
      --line:#e2e8ed;
      --surface:#ffffff;
      --canvas:#f4f7f9;
      --sidebar-width:276px;
    }
    *{box-sizing:border-box}
    html,body{min-height:100%;overflow-x:hidden!important;background:var(--canvas);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Malgun Gothic",sans-serif}
    body{font-size:16px}
    .sidebar{position:fixed!important;top:0;left:0;width:var(--sidebar-width)!important;height:100vh!important;padding:18px 14px!important;background:var(--surface)!important;border-right:1px solid var(--line);z-index:1000!important;overflow-y:auto;transition:transform .22s ease!important}
    .sidebar .app-name{margin:0 0 18px!important;padding:4px 10px 18px!important;border-bottom:1px solid var(--line)}
    .sidebar .app-name a{display:block!important;color:var(--navy)!important;font-size:19px!important;line-height:1.35!important;font-weight:750!important;text-decoration:none!important}
    .sidebar-nav,.sidebar-nav ul,.sidebar-nav li{margin:0!important;padding:0!important;list-style:none!important}
    .sidebar-nav strong{display:block;margin:18px 8px 6px!important;padding:0!important;color:var(--muted)!important;font-size:14px!important;font-weight:700!important;letter-spacing:.04em;text-transform:uppercase;cursor:pointer}
    .sidebar-nav .folder::after{display:none!important;content:none!important}
    .sidebar-nav a{display:block!important;margin:2px 0;padding:9px 10px!important;border-radius:7px;color:#405260!important;font-size:16px!important;line-height:1.45!important;text-decoration:none!important;transition:background .15s,color .15s}
    .sidebar-nav a:hover{background:#f1f6f6;color:var(--teal)!important}
    .sidebar-nav li.active>a{background:#e8f3f2;color:#126b67!important;font-weight:650!important;text-decoration:none!important}
    .sidebar-nav li.folder>p>a{display:block!important;margin:5px 0!important;padding:10px 12px!important;border:1px solid #e7edf1!important;border-radius:8px!important;background:#f7f9fa!important;color:var(--navy)!important;font-size:15px!important;font-weight:700!important;line-height:1.4!important}
    .sidebar-nav li.folder>p>a strong{display:inline!important;margin:0!important;padding:0!important;color:inherit!important;font-size:inherit!important;font-weight:inherit!important;letter-spacing:0!important;text-transform:none!important}
    .sidebar-nav li.folder.active>p>a,.sidebar-nav li.folder.open>p>a{border-color:#c9e2df!important;background:#eaf4f3!important;color:#126b67!important}
    .sidebar-nav li.folder>ul{margin:2px 0 10px 12px!important;padding:3px 0 3px 12px!important;border-left:2px solid #dce7eb!important}
    .sidebar-nav li.folder>ul a{margin:2px 0!important;padding:8px 10px!important;color:#526371!important;font-size:15px!important;line-height:1.45!important}
    .sidebar-nav li.folder>ul li.active>a{border-left:3px solid var(--teal)!important;background:#e8f3f2!important;color:#126b67!important;font-weight:700!important}
    .eod-category-back{display:inline-flex!important;align-items:center;gap:6px;margin:0 0 22px!important;padding:8px 12px!important;border:1px solid var(--line)!important;border-radius:8px!important;background:#fff!important;color:var(--navy)!important;font-size:14px!important;font-weight:650!important;text-decoration:none!important}
    .eod-category-back:hover{border-color:#b9d8d5!important;background:#edf6f5!important;color:#126b67!important}
    .sidebar-nav li p{margin:0!important}
    .content{position:absolute!important;top:0;left:var(--sidebar-width)!important;width:calc(100% - var(--sidebar-width))!important;min-height:100vh;margin-left:0!important;padding:0!important;transition:all .22s ease!important}
    body.close .sidebar{transform:translateX(-100%)!important}
    body.close .content{left:0!important;width:100%!important}
    .markdown-section{max-width:980px!important;margin:0 auto!important;padding:48px 48px 80px!important;color:var(--ink)!important;font-size:16px!important;line-height:1.8!important}
    .markdown-section h1,.markdown-section h2,.markdown-section h3,.markdown-section h4{color:var(--navy)!important;font-weight:700!important;line-height:1.35!important}
    .markdown-section h1{margin:0 0 22px!important;padding-bottom:16px;border-bottom:1px solid var(--line);font-size:30px!important}
    .markdown-section h2{margin:34px 0 12px!important;font-size:22px!important}
    .markdown-section h3{margin:28px 0 10px!important;font-size:17px!important}
    .markdown-section p{margin:0 0 16px!important}
    .markdown-section a{color:var(--teal)!important;text-decoration-thickness:1px;text-underline-offset:3px}
    .markdown-section a:hover{color:#105d59!important}
    .markdown-section hr{margin:30px 0!important;border:0;border-top:1px solid var(--line)!important}
    .markdown-section blockquote{margin:22px 0!important;padding:14px 18px!important;border-left:3px solid #d4a84f!important;background:#fff9eb;color:#5b4b2d}
    .markdown-section table{display:block;max-width:100%;overflow-x:auto;border-collapse:collapse;font-size:14px}
    .markdown-section th,.markdown-section td{padding:10px 12px;border:1px solid var(--line)}
    .markdown-section th{background:#f3f6f8;color:var(--navy);text-align:left}
    .markdown-section img{max-width:100%;height:auto;border-radius:8px}
    .markdown-section input,.markdown-section select,.markdown-section button{font:inherit}
    .markdown-section :focus-visible,.sidebar a:focus-visible,.sidebar-toggle:focus-visible{outline:3px solid #64a9a5;outline-offset:2px}
    .card-container{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;margin:24px 0}
    .case-card{display:block;padding:18px 20px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink)!important;text-decoration:none!important;box-shadow:0 1px 2px #13283a08;transition:border-color .15s,box-shadow .15s,transform .15s}
    .case-card:hover{border-color:#a8cfcc;box-shadow:0 8px 22px #18324b0d;transform:translateY(-2px)}
    .case-card h4{margin:0 0 8px!important;color:var(--navy)!important;font-size:16px!important}
    .case-card p{margin:0!important;color:var(--muted);font-size:14px;line-height:1.65}
    .sidebar-toggle{position:fixed!important;left:16px!important;top:16px!important;bottom:auto!important;z-index:1001!important;width:44px!important;height:44px!important;border:0!important;border-radius:50%!important;background:var(--navy)!important;box-shadow:0 4px 12px #102a3a30;display:flex!important;align-items:center;justify-content:center}
    .sidebar-toggle span{width:19px!important;height:2px!important;margin:4px 0!important;background:#fff!important}
    .back-to-list{display:none!important}
    @media(max-width:900px){
      .markdown-section{padding:36px 30px 72px!important}
    }
    @media(max-width:768px){
      .sidebar-toggle{top:12px!important;bottom:auto!important;left:12px!important;width:40px!important;height:40px!important}
      .content{left:0!important;right:0!important;width:100vw!important;max-width:100vw!important;margin:0!important;transform:none!important}
      body.close .content{left:0!important;right:0!important;width:100vw!important;max-width:100vw!important;margin:0!important;transform:none!important}
      .sidebar{width:min(62vw,250px)!important;min-width:200px!important}
      body:not(.close) .sidebar{transform:translateX(0)!important}
      body:not(.close) .content{left:0!important;right:0!important;width:100vw!important;max-width:100vw!important;margin:0!important;transform:none!important}
      body:not(.close) .content:before{content:"";position:fixed;inset:0;background:#14253466;z-index:999}
      body.close .content:before{display:none!important}
      .markdown-section{box-sizing:border-box!important;width:100%!important;max-width:980px!important;margin:0 auto!important;padding:76px 20px 78px!important;font-size:15px!important}
      .markdown-section h1{font-size:25px!important}
      .markdown-section h2{font-size:20px!important}
      .input-mode-container{flex-wrap:wrap}
    }
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition:none!important}}
  </style>
</head>
<body>
  <script>
    if (window.matchMedia('(max-width: 768px)').matches) {
      document.body.classList.add('close');
    }

    document.addEventListener('click', function(event) {
      var isMobile = window.matchMedia('(max-width: 768px)').matches;
      if (isMobile && document.body.classList.contains('close')) return;
      var target = event.target instanceof Element ? event.target : event.target.parentElement;
      if (!target || target.closest('.sidebar-toggle')) return;
      var link = target.closest('.sidebar-nav a');
      var categoryItem = link && link.parentElement && link.parentElement.matches('p') && link.parentElement.parentElement;
      var categoryRow = target.closest('.sidebar-nav li.folder > p');
      if (categoryRow && (!link || link.parentElement !== categoryRow)) {
        var rowCategory = categoryRow.parentElement;
        var rowChildren = rowCategory.querySelector(':scope > ul');
        var rowExpanded = rowChildren && rowChildren.getClientRects().length > 0 && window.getComputedStyle(rowChildren).display !== 'none';
        event.preventDefault();
        event.stopImmediatePropagation();
        rowCategory.classList.toggle('open', !rowExpanded);
        rowCategory.classList.toggle('collapse', rowExpanded);
        return;
      }
      if (categoryItem && categoryItem.matches('li.folder')) {
        var textWalker = document.createTreeWalker(link, NodeFilter.SHOW_TEXT);
        var textNode;
        var clickedText = false;
        while ((textNode = textWalker.nextNode())) {
          var textRange = document.createRange();
          textRange.selectNodeContents(textNode);
          var textRects = textRange.getClientRects();
          for (var rectIndex = 0; rectIndex < textRects.length; rectIndex++) {
            var rect = textRects[rectIndex];
            if (event.clientX >= rect.left && event.clientX <= rect.right && event.clientY >= rect.top && event.clientY <= rect.bottom) {
              clickedText = true;
              break;
            }
          }
          if (clickedText) break;
        }
        if (!clickedText) {
          var categoryChildren = categoryItem.querySelector(':scope > ul');
          var categoryExpanded = categoryChildren && categoryChildren.getClientRects().length > 0 && window.getComputedStyle(categoryChildren).display !== 'none';
          event.preventDefault();
          event.stopImmediatePropagation();
          categoryItem.classList.toggle('open', !categoryExpanded);
          categoryItem.classList.toggle('collapse', categoryExpanded);
          return;
        }
        var destination = link.hash.split('?')[0].replace(/\/$/, '');
        var currentRoute = window.location.hash.split('?')[0].replace(/\/$/, '');
        var childList = categoryItem.querySelector(':scope > ul');
        var isExpanded = childList && childList.getClientRects().length > 0 && window.getComputedStyle(childList).display !== 'none';
        if (destination === currentRoute) {
          event.preventDefault();
          event.stopImmediatePropagation();
          categoryItem.classList.toggle('open', !isExpanded);
          categoryItem.classList.toggle('collapse', isExpanded);
        } else {
          window.__expandSidebarCategory = destination;
        }
      }
      if (link) {
        if (isMobile) window.__keepMobileSidebarOpen = true;
      } else if (isMobile && !target.closest('.sidebar')) {
        document.body.classList.add('close');
      }
    });
  </script>
  <div id="app">로딩 중...</div>
  <script>
    window.$docsify = {
      name: `
        <div style="text-align: center; line-height: 1.2;">
          <span style="color: #0056b3; font-weight: 900; font-size: 1.1em;">EOD 지식창고</span><br>
          <span style="font-size: 0.55em; color: #6c757d; font-weight: normal; letter-spacing: 0.5px;">© 2026 J. W. Lee</span>
        </div>
      `,
      loadSidebar: true, // 필수: 사이드바 파일 불러오기
      subMaxLevel: 2,    // 필수: 사이드바 하위 목차 레벨 설정
      auto2top: true,    // 필수: 페이지 이동 시 스크롤 맨 위로
      alias: { '/.*/_sidebar.md': '/_sidebar.md' },
      sidebarCollapse: { collapse: true },
      plugins: [
        function(hook, vm) {
          hook.doneEach(function() {
            if (window.__keepMobileSidebarOpen && window.matchMedia('(max-width: 768px)').matches) {
              document.body.classList.remove('close');
              window.__keepMobileSidebarOpen = false;
            }
            var folder = vm.route.path.split('/')[1];
            if (!folder) return;
            var link = document.querySelector('.sidebar-nav a[href*="/' + folder + '/"]');
            if (link) {
              var parentLi = link.closest('li').parentElement.closest('li');
              if (parentLi) {
                parentLi.classList.add('open');
                parentLi.classList.remove('collapse');
              }
            }
            if (window.__expandSidebarCategory) {
              var categoryLinks = document.querySelectorAll('.sidebar-nav li.folder > p > a');
              for (var i = 0; i < categoryLinks.length; i++) {
                var categoryHash = categoryLinks[i].hash.split('?')[0].replace(/\/$/, '');
                if (categoryHash === window.__expandSidebarCategory) {
                  var categoryItem = categoryLinks[i].parentElement.parentElement;
                  categoryItem.classList.add('open');
                  categoryItem.classList.remove('collapse');
                  break;
                }
              }
              window.__expandSidebarCategory = null;
            }
            var routePath = vm.route.path;
            var isExplosiveDetail = routePath.indexOf('/explosives/') === 0 && routePath !== '/explosives/README' && routePath !== '/explosives/calculator';
            var section = document.querySelector('.markdown-section');
            if (section) {
              var backLink = section.querySelector('.eod-category-back');
              if (isExplosiveDetail && !backLink) {
                backLink = document.createElement('a');
                backLink.className = 'eod-category-back';
                backLink.href = '#/explosives/README';
                backLink.textContent = '← 폭약 개요로 돌아가기';
                section.insertBefore(backLink, section.firstChild);
              } else if (!isExplosiveDetail && backLink) {
                backLink.remove();
              }
            }
          });
        }
      ]
    }
    // 폭약량 및 이격 거리 계산기 함수
// 입력 모드 저장 변수 (기본값: manual)
  let currentInputMode = 'manual';

  // 1. 입력 모드 전환 함수
  function setInputMode(mode) {
    currentInputMode = mode;
    const manualArea = document.getElementById('manualInputArea');
    const referenceArea = document.getElementById('referenceInputArea');
    const modeManualBtn = document.getElementById('modeManualBtn');
    const modeRefBtn = document.getElementById('modeRefBtn');

    if (mode === 'manual') {
      // 수동 입력 모드 활성화
      manualArea.style.display = 'block';
      referenceArea.style.display = 'none';
      modeManualBtn.style.background = '#28a745'; modeManualBtn.style.color = 'white';
      modeRefBtn.style.background = '#e9ecef'; modeRefBtn.style.color = 'black'; modeRefBtn.style.border = '1px solid #ced4da';
    } else {
      // 용기별 짐작하기 모드 활성화
      manualArea.style.display = 'none';
      referenceArea.style.display = 'block';
      modeManualBtn.style.background = '#e9ecef'; modeManualBtn.style.color = 'black'; modeManualBtn.style.border = '1px solid #ced4da';
      modeRefBtn.style.background = '#28a745'; modeRefBtn.style.color = 'white'; modeRefBtn.style.border = 'none';
    }
  }

  // 2. K-계수 수동 입력창 토글 함수
  function toggleCustomBox() {
    const kSelect = document.getElementById('kSelect').value;
    const customBox = document.getElementById('customK');
    if (kSelect === 'custom') {
      customBox.style.display = 'block';
    } else {
      customBox.style.display = 'none';
    }
  }

  // 3. 폭약량 및 이격 거리 계산 함수
  function calculateEOD() {
    // 공통 입력값
    const re = parseFloat(document.getElementById('expType').value);
    const kSelectElement = document.getElementById('kSelect');
    const kSelectValue = kSelectElement.value;
    
    // 모드에 따른 폭약 무게(g) 결정
    let weight_g = 0;
    if (currentInputMode === 'manual') {
      weight_g = parseFloat(document.getElementById('weight_g').value);
    } else {
      // 용기별 선택 시, 선택 항목의 그램 값이 그대로 TNT 등가 무게로 사용됨
      weight_g = parseFloat(document.getElementById('containerSelect').value);
      // Standoff 차트는 TNT 등가 기준이므로, 이 모드에서는 RE 계수를 1.00으로 강제하는 것이 정확하지만
      // 요원님의 요청 스타일대로 선택창의 폭약 종류는 유지하되, Standoff 차트 값을 'TNT Equivalent'로 간주하여 처리함.
      // 더 정확한 전술 계산을 위해, Standoff 차트 값은 TNT 그 자체로 RE=1.00을 적용하는 계산식을 따름.
    }
    
    // 유효성 검사
    if(isNaN(weight_g) || weight_g <= 0) {
      alert("유효한 폭약 무게를 그램(g) 단위로 입력하거나 용기를 선택하세요.");
      return;
    }

    // [전술 계산 로직 핵심]
    // 1. TNT 환산 무게 계산 (입력한 폭약 종류의 RE 계수 적용)
    // 용기 선택 모드일 때도, Standoff 차트 값을 TNT로 간주하고 입력한 폭약 종류의 RE를 적용하여 위력을 계산함.
    const tntEq_g = weight_g * re;
    const tntEq_gStr = tntEq_g.toFixed(0); // 결과는 그램(g) 단위, 정수 표시
    
    // 2. K-계수 공식을 위한 kg 단위 환산
    // Hopkinson-Cranz 공식 (D = K * W^(1/3))에서 W는 일반적으로 kg 단위를 사용함.
    const tntEq_kg = tntEq_g / 1000;
    
    // 기본 안전 거리 (18, 40) 계산
    document.getElementById('tntResult').innerText = Number(tntEq_gStr).toLocaleString('ko-KR'); // 쉼표 표시
    document.getElementById('distOpen').innerText = (18 * Math.pow(tntEq_kg, 1/3)).toFixed(2);
    document.getElementById('distPerson').innerText = (40 * Math.pow(tntEq_kg, 1/3)).toFixed(2);
    
    // 선택형/수동 K값 처리 영역
    const customContainer = document.getElementById('customResultContainer');
    let activeK = null; // 계산식 표시에 쓸 K값
    
    if (kSelectValue !== 'none') {
       let kVal = 0;
       let kLabelText = "";

       if (kSelectValue === 'custom') {
         kVal = parseFloat(document.getElementById('customK').value);
         kLabelText = `수동 입력 기준 (K=${kVal})`;
         if(isNaN(kVal) || kVal <= 0) {
           alert("유효한 K값을 수동으로 입력해 주세요.");
           return;
         }
       } 
       else {
         kVal = parseFloat(kSelectValue);
         kLabelText = kSelectElement.options[kSelectElement.selectedIndex].text;
       }

       // 선택한 K값에 대한 계산
       const distCustom = (kVal * Math.pow(tntEq_kg, 1/3)).toFixed(2);
       document.getElementById('customKLabel').innerText = kLabelText;
       document.getElementById('distCustom').innerText = distCustom;
       customContainer.style.display = 'block';
       activeK = kVal;
    } else {
       customContainer.style.display = 'none';
       activeK = 18; 
    }

    // 제일 아래 계산식 표시 업데이트 (유니코드 사용)
    const formulaDetail = `D = ${activeK} × ∛(${Number(tntEq_gStr).toLocaleString('ko-KR')} / 1,000)`;
    document.getElementById('formulaDetail').innerText = formulaDetail;

    // 최종 결과창 띄우기
    document.getElementById('resultArea').style.display = 'block';
  }

  // 페이지 로드 시 수동 입력 모드 버튼 스타일 초기화
  setInputMode('manual');
  </script>
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/docsify.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-sidebar-collapse/dist/docsify-sidebar-collapse.min.js"></script>
</body>
</html>
